<!DOCTYPE html>
<html>
  <head></head
    <meta name="description" content="Personal blog">
    <link rel="icon" href="./images/favicon.png" type="image/x-icon"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8"> 
    <link href="./tufte.css" rel="stylesheet" type="text/css" media="all">
      <style>

    h1, h2 {
      text-align: center;
    }

    .bio {
      text-align: center;
      font-style: italic;
      margin-bottom: 2rem;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .book {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .book:hover {
      transform: translateY(-5px);
    }

    .book img {
      width: 100%;
      height: 250px;
      object-fit: contain;
    }

    .book-info {
      padding: 10px 15px;
    }

    .book-info h3 {
      margin: 0;
      font-size: 1.1em;
    }

    .book-info p {
      margin: 0.3em 0;
      font-size: 0.9em;
      color: #555;
    }

    .notes {
      font-size: 0.85em;
      color: #666;
      margin-top: 0.5em;
    }

    .book-placeholder {
	width: 120px;
	height: 180px;
	background: #eee;
	border: 1px solid #ccc;
	display: flex;
	align-items: center;
	justify-content: center;
	color: #777;
	font-size: 14px;
    }
  </style>
  </head>
  <body>
    <div id="container">
    <div id="header">This site requires JavaScript!</div>
    <div id="content">    
      
      
      <h1>Books</h1>
      
      <p>This page shows what I have read, but also what I want to
	read. The dates are not exact. This is inspired by
	<a href="https://tomcritchlow.com/2020/04/15/library-json/">Tom
	Chritchlow</a>, <a href="https://aramzs.xyz/books/">Aram
	Zucker-Scharff</a>, and many others.
      </p>
      <h2 id="library-name"></h2>
      <p id="library-bio" class="bio"></p>
      <div id="lists"></div>
      
  <script>
    async function loadLibrary() {
      const response = await fetch('library.json');
      const library = await response.json();

      // Set the name and bio
      document.getElementById('library-name').textContent = library.name;
      document.getElementById('library-bio').textContent = library.bio;

      const listsContainer = document.getElementById('lists');

      library.lists.forEach(list => {
        const listSection = document.createElement('section');
        listSection.innerHTML = `<h2>${list.name}</h2>`;
        const shelf = document.createElement('div');
        shelf.className = 'bookshelf';

	revbooks = list.books.reverse();
        revbooks.forEach(book => {
          const bookDiv = document.createElement('div');
            bookDiv.className = 'book';
            bookDiv.innerHTML = `
            <a href="${book.link}" target="_blank">
                  ${ book.image
                           ? `<img src="${book.image}" alt="${book.title}">`
                           : `<div class="book-placeholder">No cover</div>`
                   }
            </a>
            <div class="book-info">
              <h3>${book.title}</h3>
              <p>${book.author}</p>
              <p><small>Finished: ${book.date_finished}</small></p>
              <p class="notes">${book.notes || ''}</p>
            </div>
          `;
          shelf.appendChild(bookDiv);
        });

        listSection.appendChild(shelf);
        listsContainer.appendChild(listSection);
      });
    }

    loadLibrary();
  </script>      
      
    </div> <!-- end of div id="content" -->
    <div id="footer"></div>
    </div> <!-- end of div id="container" -->
        <script src="./script.js"></script>
  </body>
</html>
